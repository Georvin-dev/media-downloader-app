<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador mp3/mp4</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-indigo-400 mb-6">
            Descargador de Video / Música
        </h1>

        <form id="downloadForm" class="space-y-4">
            <div>
                <label for="url" class="block text-sm font-medium text-slate-300 mb-1">
                    URL del Video o Playlist
                </label>
                <input 
                    type="url" 
                    id="url" 
                    placeholder="https://www.youtube.com/watch?v=..." 
                    required 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100 placeholder-slate-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Formato de Salida</label>
                <select id="opcion" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-100">
                    <option value="1">Video (Máxima Resolución MP4)</option>
                    <option value="2"> Audio (MP3 320 kbps)</option>
                </select>
            </div>

            <button 
                type="submit" 
                id="btnSubmit"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200 flex justify-center items-center gap-2"
            >
                <span id="btnText">Comenzar Descarga..</span>
                <span id="loader" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
            </button>
        </form>

        <div id="statusMessage" class="mt-4 p-3 rounded-lg text-sm text-center hidden"></div>
    </div>
    <script>
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const opcion = document.getElementById('opcion').value;
            const statusMessage = document.getElementById('statusMessage');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
    
            btnSubmit.disabled = true;
            btnText.textContent = "Procesando...";
            loader.classList.remove('hidden');
            statusMessage.classList.add('hidden');
    
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, opcion })
                });
    
                const result = await response.json();
    
                statusMessage.classList.remove('hidden');
                if (result.success) {
                    statusMessage.className = "mt-4 p-3 rounded-lg text-sm text-center bg-emerald-900/50 text-emerald-300 border border-emerald-700";
                    statusMessage.textContent = result.message;
                    document.getElementById('url').value = '';
    
                    // Redirigir la ventana del navegador al enlace del archivo para iniciar la descarga local
                    if (result.file_url) {
                        window.location.href = result.file_url;
                    }
                } else {
                    statusMessage.className = "mt-4 p-3 rounded-lg text-sm text-center bg-rose-900/50 text-rose-300 border border-rose-700";
                    statusMessage.textContent = result.message;
                }
            } catch (err) {
                statusMessage.classList.remove('hidden');
                statusMessage.className = "mt-4 p-3 rounded-lg text-sm text-center bg-rose-900/50 text-rose-300 border border-rose-700";
                statusMessage.textContent = "Error de conexión con el servidor.";
            } finally {
                btnSubmit.disabled = false;
                btnText.textContent = "Comenzar Descarga...";
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
